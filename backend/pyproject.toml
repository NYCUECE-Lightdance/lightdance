[project]
name = "backend"
version = "0.1.0"
description = "LightDance Backend API - 燈光舞蹈控制系統後端服務"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.116.1",
    "pyjwt>=2.13.0",
    "pymongo>=4.13.2",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
]

[tool.setuptools]
py-modules = ["main", "models"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
# main.py / models.py 在 backend/ 根目錄，測試在 backend/tests/，
# 讓 pytest 把根目錄放進 sys.path
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# ⚠️ 這是 CI 會擋合併的那一組，所以只放「不管功能怎麼改都一定是錯」的：
#   E9  語法錯誤
#   F63 / F7  無效的比較、放錯位置的 return / break / await
#   F82 未定義的名稱（執行到那一行才會 NameError）
# 沒用到的 import／變數（F401 / F841）是清理類，大改版拆到一半時一定會有，
# 不該讓 CI 變紅。想順手清的話：uv run ruff check --extend-select F .
# 也刻意不開格式類的規則——main.py 混用 tab 與空白縮排，
# 為了排版把整個檔案改一遍會讓每一個還開著的分支都衝突。
select = ["E9", "F63", "F7", "F82"]
