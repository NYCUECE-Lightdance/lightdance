# =================================================================
#     CI：每個 PR 與每次推上 main / dev 都會跑
# =================================================================
#
# 原則：**每一項檢查都是真的會擋下來的。**
#
# 這份檔案的前身（pr-checks.yml）有一半的步驟掛著 `continue-on-error: true`：
# ESLint 在沒有設定檔的情況下每次都失敗、Docker 建置失敗也照樣顯示綠勾、
# 後端只跑格式檢查而從來沒跑過測試。綠勾於是只代表「前端單元測試過了」，
# 其他東西壞掉時畫面上一樣是綠的——那比沒有檢查更糟，因為大家會以為有人在守。
#
# 本機跑同一套檢查：
#   cd frontend && npm run lint && npm test && npm run audit:bundle
#   cd frontend && npm run dev   # 另一個終端機
#   cd frontend && npm run e2e && npm run audit:layout
#   cd backend  && uv run ruff check . && uv run pytest

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# 同一個 PR（或同一個分支）有新的推送時，取消還在跑的舊那一輪
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  frontend:
    name: 前端：lint、單元測試、建置
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # 和 frontend/Dockerfile、docker-compose.dev.yml、run-deploy.sh 用同一個大版本
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝依賴
        run: npm ci

      - name: ESLint
        # 只有 error 會失敗；warning（例如 effect 相依陣列）只是提示。
        # 分級的理由寫在 frontend/eslint.config.mjs 開頭
        run: npm run lint

      - name: 單元測試（含韌體輸出的 golden 契約）
        # golden 測試紅燈代表 handleOutput 的輸出變了——硬體會看到不一樣的畫面
        run: npm test

      - name: 建置 + 初始 JS 大小預算
        # audit:bundle 自己會跑一次 vite build，所以不必另外 build
        run: npm run audit:bundle

  # ---------------------------------------------------------------
  e2e:
    name: 前端：瀏覽器驗收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝依賴與 Chromium
        # --with-deps 會一併裝系統字型（含中日韓字型）。少了中文字型的話，
        # 版面稽核量到的文字寬度會和真實環境不同
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 啟動開發伺服器
        # 腳本會攔截所有 /api/** 回假資料，所以不需要後端
        run: |
          npm run dev > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && exit 0
            sleep 1
          done
          echo "::error::vite 開發伺服器 60 秒內沒有起來"
          cat vite.log
          exit 1

      - name: 功能驗收（npm run e2e）
        run: npm run e2e

      - name: 版面稽核（npm run audit:layout）
        # if: always() —— 功能驗收失敗時也照樣跑，兩份結果一次看完
        if: always()
        run: npm run audit:layout

      - name: 上傳截圖與伺服器日誌
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-shots
          path: |
            frontend/e2e/shots/
            frontend/vite.log
          retention-days: 7

  # ---------------------------------------------------------------
  backend:
    name: 後端：靜態檢查、測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # 和 backend/Dockerfile 的 python:3.11 一致
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 安裝依賴（照 uv.lock，不重新解析）
        run: uv sync --frozen

      - name: Ruff（pyflakes：未定義的名稱、沒用到的 import）
        # 規則在 backend/pyproject.toml 的 [tool.ruff.lint]
        run: uv run --frozen ruff check .

      - name: pytest
        env:
          # 測試用的是假的 collection，不需要 MongoDB。但 main.py 在 import 時會
          # ping 一次資料庫，預設要等 30 秒才放棄；指向一個不存在的位址並把
          # 逾時縮短，讓那一下立刻失敗
          MONGO_CONNECT_URI: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=500
        run: uv run --frozen pytest

  # ---------------------------------------------------------------
  docker:
    name: Docker：映像建置與 compose 設定
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - name: 建置後端映像
        run: docker build -t lightdance-backend:ci ./backend

      - name: 建置前端映像
        run: docker build -t lightdance-frontend:ci ./frontend

      - name: 檢查 docker-compose.dev.yml
        run: docker compose -f docker-compose.dev.yml --env-file .env.development config --quiet

      - name: 檢查 docker-compose.prod.yml
        # 正式環境的 .env.deployment 不在版控裡（裡面是真的帳密），
        # 用範本檔代替，只驗證 compose 檔本身的語法與結構
        run: |
          cp .env.deployment.example .env.deployment
          docker compose -f docker-compose.prod.yml --env-file .env.deployment config --quiet

  # ---------------------------------------------------------------
  # 分支保護只要把「CI 結果」這一項設成必須通過就好：以後新增或改名
  # 其他 job，不必再回去改保護規則
  result:
    name: CI 結果
    runs-on: ubuntu-latest
    needs: [frontend, e2e, backend, docker]
    if: always()

    steps:
      - name: 彙整
        run: |
          echo "前端：${{ needs.frontend.result }}"
          echo "瀏覽器驗收：${{ needs.e2e.result }}"
          echo "後端：${{ needs.backend.result }}"
          echo "Docker：${{ needs.docker.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::有檢查沒有通過，請看上面是哪一項"
            exit 1
          fi
