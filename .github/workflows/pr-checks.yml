name: Pull Request 檢查

on:
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]

# 確保只有一個相同 PR 的 workflow 在執行
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 程式碼品質檢查
  code-quality:
    name: 程式碼品質檢查
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4
        with:
          # 獲取完整歷史以便更好的 diff 分析
          fetch-depth: 0

      - name: 🔍 檢查檔案變更
        run: |
          echo "=== 本次 PR 變更的檔案 ==="
          git diff --name-only origin/${{ github.base_ref }}...HEAD
          echo "=========================="

  # 前端測試和建置
  frontend-tests:
    name: 前端測試與建置
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🏗️ 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 安裝前端依賴
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 ESLint 程式碼檢查
        working-directory: ./frontend
        run: |
          echo "📋 執行 ESLint 檢查..."
          npx eslint src/ --ext .js,.jsx,.ts,.tsx --format=stylish
        continue-on-error: true

      - name: 🎨 Prettier 格式檢查
        working-directory: ./frontend
        run: |
          echo "🎨 檢查程式碼格式..."
          npx prettier --check src/
        continue-on-error: true

      # 硬性門檻：golden 測試守住韌體輸出契約（PlayerData 格式）
      # 若這裡紅燈，代表 handleOutput 的輸出與基準不同，硬體會看到不一樣的畫面
      - name: 🧪 執行單元測試（含 golden 輸出契約）
        working-directory: ./frontend
        run: |
          echo "🧪 執行 vitest..."
          npm test

      - name: 🏗️ 建置前端
        working-directory: ./frontend
        run: |
          echo "🏗️ 建置前端應用程式..."
          npm run build

      - name: 📊 上傳測試覆蓋率報告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # 後端測試和檢查
  backend-tests:
    name: 後端測試與檢查
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 快取 UV 和依賴
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            backend/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}

      - name: 📦 安裝 UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: 📦 安裝後端依賴
        working-directory: ./backend
        run: |
          echo "📦 安裝 Python 依賴..."
          uv venv --clear
          source .venv/bin/activate
          uv pip install -e .

      - name: 🔍 程式碼風格檢查
        working-directory: ./backend
        run: |
          echo "🔍 執行程式碼風格檢查..."
          source .venv/bin/activate
          # 安裝 linting 工具
          uv pip install black isort flake8
          
          echo "🎨 檢查程式碼格式 (Black)..."
          black --check --diff .
          
          echo "📦 檢查 import 順序 (isort)..."
          isort --check-only --diff .
          
          echo "🔍 檢查程式碼品質 (flake8)..."
          flake8 . --max-line-length=88 --extend-ignore=E203,W503
        continue-on-error: true

  # Docker 建置測試
  docker-build:
    name: Docker 建置測試
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐳 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔧 建置前端 Docker 映像
        run: |
          echo "🔧 建置前端 Docker 映像..."
          docker build -t lightdance-frontend:test ./frontend
        continue-on-error: true

      - name: 🔧 建置後端 Docker 映像
        run: |
          echo "🔧 建置後端 Docker 映像..."
          docker build -t lightdance-backend:test ./backend
        continue-on-error: true

      - name: 🐳 測試 Docker Compose 配置
        run: |
          echo "🐳 測試 Docker Compose 配置..."
          # 檢查 docker-compose.dev.yml 語法
          docker compose -f docker-compose.dev.yml config
        continue-on-error: true

  # 整合測試（可選）
  integration-tests:
    name: 整合測試
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    if: success()
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🔄 等待 MongoDB 準備就緒
        run: |
          echo "🔄 等待 MongoDB 服務啟動..."
          timeout 30 bash -c 'until nc -z localhost 27017; do sleep 1; done'
          echo "✅ MongoDB 已就緒"

      - name: 🧪 執行基本 API 健康檢查
        run: |
          echo "🧪 未來可在此處加入 API 整合測試"
          echo "💡 建議：使用 pytest 或 postman/newman 進行 API 測試"

  # 結果總結
  pr-summary:
    name: PR 檢查總結
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-tests, backend-tests, docker-build, integration-tests]
    if: always()
    
    steps:
      - name: 📊 檢查結果總結
        run: |
          echo "=== Pull Request 檢查結果總結 ==="
          echo "程式碼品質檢查: ${{ needs.code-quality.result }}"
          echo "前端測試: ${{ needs.frontend-tests.result }}"
          echo "後端測試: ${{ needs.backend-tests.result }}"
          echo "Docker 建置: ${{ needs.docker-build.result }}"
          echo "整合測試: ${{ needs.integration-tests.result }}"
          echo "============================"
          
          # 如果有任何關鍵測試失敗，則整體失敗
          if [[ "${{ needs.frontend-tests.result }}" == "failure" || "${{ needs.backend-tests.result }}" == "failure" ]]; then
            echo "❌ 關鍵測試失敗，請檢查並修復"
            exit 1
          else
            echo "✅ 所有檢查通過或僅有非關鍵警告"
          fi